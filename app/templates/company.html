{% extends 'base.html' %}{% block content %}<h1>Configurações da empresa</h1><form method="post" class="card grid"><label>Nome<input name="name" value="{{company.name}}" required></label><label>CNPJ<input name="cnpj" value="{{company.cnpj or ''}}"></label><label>Endereço<input name="address" value="{{company.address or ''}}"></label><label>Latitude<input name="lat" value="{{company.lat or ''}}"></label><label>Longitude<input name="lng" value="{{company.lng or ''}}"></label><label>Raio permitido (m)<input name="radius_m" type="number" value="{{company.radius_m}}"></label><label>Tolerância (min)<input name="tolerance_min" type="number" value="{{company.tolerance_min}}"></label><label>Horas semanais<input name="weekly_hours" value="{{company.weekly_hours}}"></label><label>Entrada<input name="work_start" value="{{company.work_start}}"></label><label>Intervalo saída<input name="break_start" value="{{company.break_start}}"></label><label>Intervalo retorno<input name="break_end" value="{{company.break_end}}"></label><label>Saída<input name="work_end" value="{{company.work_end}}"></label><div><button>Salvar</button></div></form><div class="card"><h3>Como configurar localização</h3><p>Use o botão de localização do mapa/GPS ou informe latitude e longitude. A batida será aceita somente dentro do raio configurado.</p></div>{% endblock %}
