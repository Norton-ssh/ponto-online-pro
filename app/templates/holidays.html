{% extends 'base.html' %}{% block content %}<h1>Feriados</h1><form method="post" class="card filters"><input type="date" name="day" required><input name="name" placeholder="Nome do feriado" required><button>Adicionar</button></form><div class="card"><table><tr><th>Data</th><th>Feriado</th></tr>{% for x in items %}<tr><td>{{x.day.strftime('%d/%m/%Y')}}</td><td>{{x.name}}</td></tr>{% endfor %}</table></div>{% endblock %}
