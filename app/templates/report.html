{% extends 'base.html' %}{% block content %}<h1>Relatório / Espelho</h1><form class="card filters"><input type="date" name="start" value="{{start}}"><input type="date" name="end" value="{{end}}"><button>Gerar</button></form><div class="card"><table><tr><th>Funcionário</th><th>Registros</th><th>Horas trabalhadas</th><th>Meta semanal</th></tr>{% for u,ps,m in rows %}<tr><td>{{u.name}}</td><td>{{ps|length}}</td><td>{{fmt_minutes(m)}}</td><td>{{u.company.weekly_hours}} h</td></tr>{% endfor %}</table></div>{% endblock %}
