{% extends 'base.html' %}{% block content %}<h1>Editar funcionário</h1><form method="post" class="card grid"><label>Nome<input name="name" value="{{employee.name}}" required></label><label>CPF<input name="cpf" value="{{employee.cpf or ''}}"></label><label>Matrícula<input name="matricula" value="{{employee.matricula or ''}}"></label><label>Cargo<input name="cargo" value="{{employee.cargo or ''}}"></label><label>Departamento<input name="department" value="{{employee.department or ''}}"></label><label>Nova senha<input name="password" type="password"></label><button>Salvar</button></form>{% endblock %}
